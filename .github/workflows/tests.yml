name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8081:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for ParaBank
        run: |
          # the first request to the web front end initialises the database,
          # so the API answers only after the page has been visited once
          for i in $(seq 1 40); do
            curl -s -L -o /dev/null --max-time 20 http://localhost:8081/parabank/index.htm || true
            code=$(curl -s -o /dev/null -w "%{http_code}" -H 'Accept: application/json' \
              http://localhost:8081/parabank/services/bank/accounts/12345 || true)
            if [ "$code" = "200" ]; then echo "ready after $i attempts"; exit 0; fi
            sleep 10
          done
          echo "ParaBank did not become ready"; exit 1
      - run: mvn -B test
        env:
          BASE_URL: http://localhost:8081/parabank/services/bank
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8081:8080
    steps:
      - uses: actions/checkout@v4
      - name: Wait for ParaBank
        run: |
          # the first request to the web front end initialises the database,
          # so the API answers only after the page has been visited once
          for i in $(seq 1 40); do
            curl -s -L -o /dev/null --max-time 20 http://localhost:8081/parabank/index.htm || true
            code=$(curl -s -o /dev/null -w "%{http_code}" -H 'Accept: application/json' \
              http://localhost:8081/parabank/services/bank/accounts/12345 || true)
            if [ "$code" = "200" ]; then echo "ready after $i attempts"; exit 0; fi
            sleep 10
          done
          echo "ParaBank did not become ready"; exit 1
      - name: Run the read load profile
        run: |
          docker run --rm --network host \
            -v "$PWD/load":/scripts \
            -e BASE_URL=http://localhost:8081/parabank/services/bank \
            -e VUS=10 -e DURATION=20s \
            grafana/k6 run /scripts/read-endpoints.js
      - name: Run the write load profile
        run: |
          docker run --rm --network host \
            -v "$PWD/load":/scripts \
            -e BASE_URL=http://localhost:8081/parabank/services/bank \
            -e VUS=5 \
            grafana/k6 run /scripts/transfer-write-load.js
